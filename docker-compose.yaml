version: '3'

services:
  chatwoot:
    build:
      context: ./chatwoot
      dockerfile: Dockerfile
    environment:
      - 'SECRET_KEY_BASE=${SERVICE_PASSWORD_CHATWOOT}'
      - 'FRONTEND_URL=https://chat.neosolucoes.net'
      - 'DEFAULT_LOCALE=${CHATWOOT_DEFAULT_LOCALE}'
      - 'FORCE_SSL=${FORCE_SSL:-false}'
      - 'ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-false}'
      - 'REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@dgc8wcw04g4kkckws488sggw:6379/0'
      - 'POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}'
      - POSTGRES_HOST=okocw0ko8sgkcsks8owgss8k
      - 'POSTGRES_USERNAME=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}'
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - 'MAILER_SENDER_EMAIL=${CHATWOOT_MAILER_SENDER_EMAIL}'
      - 'SMTP_ADDRESS=${CHATWOOT_SMTP_ADDRESS}'
      - 'SMTP_AUTHENTICATION=${CHATWOOT_SMTP_AUTHENTICATION}'
      - 'SMTP_DOMAIN=${CHATWOOT_SMTP_DOMAIN}'
      - 'SMTP_ENABLE_STARTTLS_AUTO=${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}'
      - 'SMTP_PORT=${CHATWOOT_SMTP_PORT}'
      - 'SMTP_USERNAME=${CHATWOOT_SMTP_USERNAME}'
      - 'SMTP_PASSWORD=${CHATWOOT_SMTP_PASSWORD}'
      - 'ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}'
    entrypoint: docker/entrypoints/rails.sh
    command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    volumes:
      - 'rails-data:/app/storage'
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://127.0.0.1:3000'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify
    labels:
      - coolify.managed=true
      - traefik.enable=true
      - traefik.http.routers.chat.rule=Host(chat.neosolucoes.net)
      - traefik.http.routers.chat.entrypoints=websecure
      - traefik.http.routers.chat.tls=true
      - traefik.http.services.chat.loadbalancer.server.port=3000

  sidekiq:
    build:
      context: ./chatwoot
      dockerfile: Dockerfile
    environment:
      - 'SECRET_KEY_BASE=${SERVICE_PASSWORD_CHATWOOT}'
      - 'FRONTEND_URL=https://chat.neosolucoes.net'
      - 'DEFAULT_LOCALE=${CHATWOOT_DEFAULT_LOCALE}'
      - 'FORCE_SSL=${FORCE_SSL:-false}'
      - 'ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-false}'
      - 'REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@dgc8wcw04g4kkckws488sggw:6379/0'
      - 'POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}'
      - POSTGRES_HOST=okocw0ko8sgkcsks8owgss8k
      - 'POSTGRES_USERNAME=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - RAILS_MAX_THREADS=5
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - 'MAILER_SENDER_EMAIL=${CHATWOOT_MAILER_SENDER_EMAIL}'
      - 'SMTP_ADDRESS=${CHATWOOT_SMTP_ADDRESS}'
      - 'SMTP_AUTHENTICATION=${CHATWOOT_SMTP_AUTHENTICATION}'
      - 'SMTP_DOMAIN=${CHATWOOT_SMTP_DOMAIN}'
      - 'SMTP_ENABLE_STARTTLS_AUTO=${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}'
      - 'SMTP_PORT=${CHATWOOT_SMTP_PORT}'
      - 'SMTP_USERNAME=${CHATWOOT_SMTP_USERNAME}'
      - 'SMTP_PASSWORD=${CHATWOOT_SMTP_PASSWORD}'
      - ACTIVE_STORAGE_SERVICE=local
    command:
      - bundle
      - exec
      - sidekiq
      - '-C'
      - config/sidekiq.yml
    volumes:
      - 'rails-data:/app/storage'
    healthcheck:
      test:
        - CMD-SHELL
        - 'ps aux | grep "[s]idekiq" > /dev/null || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  rails-data: null
  postgres-data: null
  redis-data: null
